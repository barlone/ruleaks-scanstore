; Скопируйте в config.ini и заполните. Другой файл: scanstore -config <путь>.
; Комментарии - только отдельной строкой (; или # в конце значения считаются частью значения).

[server]
; 127.0.0.1 - только локально; 0.0.0.0 - все интерфейсы (внутренняя сеть)
host = 127.0.0.1
port = 8000
; Обязателен, не короче 16 символов. Клиенты передают "Authorization: Bearer <api_token>".
; Сгенерировать: scanstore -gen-token
api_token =

[store]
; Папка с картинками; относительный путь - от папки, где лежит этот файл
dir = store

[database]
; Либо строка подключения целиком (имеет приоритет над полями ниже):
; dsn = postgres://scanstore:secret@localhost:5432/scanstore?sslmode=disable
host = localhost
port = 5432
dbname = scanstore
user = scanstore
password =
; disable | prefer | require | verify-full
sslmode = prefer
max_conns = 10
; Создавать таблицы при старте (CREATE ... IF NOT EXISTS). Отключите, если у пользователя нет прав на DDL.
migrate = true

[limits]
max_upload_mb = 20
max_meta_kb = 256
; Больше - отклоняется (защита от "бомб": декодирование берёт ~3 байта на пиксель)
max_image_mpix = 80
; Одновременных проверок JPEG; 0 - по числу ядер
max_parallel_decode = 0
